global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by:
    - alertname
    - namespace
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/deployflow-discord-webhook/url
        send_resolved: true
        title: "🚨 DeployFlow Alert: {{ .CommonLabels.alertname }}"
        message: |
          **Status:** {{ .Status }}
          **Severity:** {{ .CommonLabels.severity }}
          **Namespace:** {{ .CommonLabels.namespace }}

          {{ range .Alerts }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          {{ end }}
