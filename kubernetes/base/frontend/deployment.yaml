apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployflow-frontend
  namespace: deployflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: deployflow-frontend

  template:
    metadata:
      labels:
        app: deployflow-frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/idhananjay14/deployflow-frontend:195a96ff28dbd7a21a6fb35d9c7ca45c7fd85576
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
