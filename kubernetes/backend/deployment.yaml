apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployflow-backend
  namespace: deployflow

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: deployflow-backend

  template:
    metadata:
      labels:
        app: deployflow-backend
      annotations:
        rollout-version: "1"

    spec:
      containers:
        - name: backend
          image: ghcr.io/idhananjay14/deployflow-backend:3cfc6bf5bb5ce5920d6927c857659a8abac68a64
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          env:
            - name: PORT
              value: "3000"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployflow-db-secret
                  key: DB_PASSWORD
