apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployflow-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: deployflow-backend

  template:
    metadata:
      labels:
        app: deployflow-backend

    spec:
      containers:
        - name: backend
          image: deployflow-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: deployflow-db-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployflow-db-secret
                  key: DB_PASSWORD
