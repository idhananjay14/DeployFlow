name: Frontend CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'kubernetes/frontend/deployment.yaml'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: deployflow-frontend:${{ github.sha }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployflow-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deployflow-frontend:latest
            ghcr.io/${{ github.repository_owner }}/deployflow-frontend:${{ github.sha }}

      - name: Update Kubernetes image tag
        if: github.event_name == 'push'
        working-directory: .
        run: |
          sed -i "s|image: .*deployflow-frontend:.*|image: ghcr.io/${{ github.repository_owner }}/deployflow-frontend:${{ github.sha }}|" kubernetes/frontend/deployment.yaml

      - name: Commit and push image tag
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "Deploy frontend image ${{ github.sha }}"
          git push
