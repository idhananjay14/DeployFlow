name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deployflow-backend:latest
            ghcr.io/${{ github.repository_owner }}/deployflow-backend:${{ github.sha }}

      - name: Update Kubernetes image tag
        if: github.event_name == 'push'
        working-directory: .
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/deployflow-backend:.*|image: ghcr.io/${{ github.repository_owner }}/deployflow-backend:${{ github.sha }}|" kubernetes/backend/deployment.yaml

      - name: Commit and push image tag
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/backend/deployment.yaml
          git diff --cached --quiet || git commit -m "Deploy backend image ${{ github.sha }}"
          git push